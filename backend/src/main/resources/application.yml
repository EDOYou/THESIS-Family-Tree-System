spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/familytree
    username: postgres
    password: "postgres"
    driverClassName: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
